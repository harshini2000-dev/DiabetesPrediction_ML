<!DOCTYPE html>
<html>
<head>
	<title>FORM</title>
	<link rel="stylesheet" href="static/mystyle.css">
	<script type="text/javascript">

		function GetGender()
		{
			preg = document.getElementById('preg_name');
			entry1 = document.getElementById('entry1');
			gendervalue = document.querySelector('input[name="GenderRadio"]:checked').value;

			if(gendervalue == 'Male')
			{
				preg.style.display = 'none';
				entry1.style.display = 'none'
			}
			else{
				preg.style.display = 'block';
			 	entry1.style.display = 'block'
			}
		}

		function validate()
		{
			var x1 = String(document.forms["myForm"]["entry1"].value);
			var x2 = String(document.forms["myForm"]["entry2"].value);
			var x3 = String(document.forms["myForm"]["entry3"].value);
			var x4 = String(document.forms["myForm"]["entry4"].value);
			var x5 = String(document.forms["myForm"]["entry5"].value);
			var x6 = String(document.forms["myForm"]["entry6"].value);
			var x7 = String(document.forms["myForm"]["entry7"].value);
			var x8 = String(document.forms["myForm"]["entry8"].value);
			return true;
		}
	</script>
</head>

<body style="background-color:Lavender;">
<center>
<form  name="myForm" action = "http://localhost:9999/result" method = "POST" onsubmit="return validate()">
	<h2>PATIENT REPORT</h2>
	<table class="center">
		<tr>
			<td>Gender</td>
			<td>
				<input type="radio" id="femaleID" name="GenderRadio" value="Female" checked onclick="GetGender()">
				<label for="Female">Female</label>
				&nbsp;&nbsp;&nbsp;
				<input type="radio" id="maleID" name="GenderRadio" value="Male" onclick="GetGender()">
				<label for="Male">Male</label><br>
			</td>
		</tr>
        <tr>
			<td> <span id="preg_name">Pregnancies</span> </td>
			<td> <input type="number" id="entry1" name="entry1" min="0" max="15" placeholder="0" value="0"  required></td>
		</tr>
		<tr>
			<td>Glucose </td>
			<td><input type="number" id="entry2" name="entry2" placeholder="130" title="min 40, max 200"  min="40" max="200" step="any"  required></td>
		</tr>

		<tr>
			<td>Blood Pressure</td>
			<td><input type="number" id="entry3" name="entry3" placeholder="60" title="min 25, max 200" min="25" max="200" step="any"  required>mm Hg</td>
		</tr>

		<tr>
			<td>Skin Thickness (Triceps)</td>
			<td><input type="number" id="entry4" name="entry4" placeholder="30" title="min 7.0 max 110.0" min="7" max="110" step="any" required>mm</td>
		</tr>
		<tr>
			<td>Insulin</td>
			<td><input type="number" id="entry5" name="entry5" placeholder="120" title="min 14 max 800" min="14" max="800" step="any" required>mu U/ml</td>
		</tr>
		<tr>
			<td>BMI (Body Mass Index) </td>
			<td><input type="number" id="entry6" name="entry6" placeholder="33.5" title="18 or more" min="18" max="90" step="any" required>(kg/m²)</td>
		</tr>
		<tr>
			<td>DiabetesPedigree Function (Diabetic family history)</td>
			<td><input type="number" id="entry7" name="entry7" placeholder="0.2" title="min 0.0 max 2.5"  min="0" max="2.5" step="any" required></td>
		</tr>
		<tr>
			<td>Age</td>
			<td><input type="number" id="entry8" name="entry8" min="10" max="80" placeholder="30" required></td>
		</tr>
		</table>
		<div>
			<input type="submit" value="SUBMIT" onclick="validate()" style="align-self: center;"
			class="button">
		</div>
</form>
</center>
</body>
</html>
